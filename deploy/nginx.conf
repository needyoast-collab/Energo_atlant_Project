# Nginx конфигурация для energoatlant.ru
# Путь на VPS: /etc/nginx/sites-available/energoatlant
# Активация: ln -s /etc/nginx/sites-available/energoatlant /etc/nginx/sites-enabled/

# ──────────────────────────────────────────────────────────────────────────────
# 1. HTTP → HTTPS редирект (все домены)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name energoatlant.ru www.energoatlant.ru;
    return 301 https://energoatlant.ru$request_uri;
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. www → non-www редирект (HTTPS)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.energoatlant.ru;

    ssl_certificate     /etc/letsencrypt/live/energoatlant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energoatlant.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://energoatlant.ru$request_uri;
}

# ──────────────────────────────────────────────────────────────────────────────
# 3. Основной сервер — energoatlant.ru (HTTPS)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name energoatlant.ru;

    ssl_certificate     /etc/letsencrypt/live/energoatlant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energoatlant.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/energoatlant/public;
    index index.html;

    # ── Статика: долгий кеш ──────────────────────────────────────────────────
    location ~* \.(css|js|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── HTML: короткий кеш (revalidate) ─────────────────────────────────────
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── API проксируется на Node.js ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Прочее: отдаём статику, при 404 → index.html ────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Убираем дублирующий CSP: единственный строгий заголовок ─────────────
    # (убедись, что в server.js / helmet.js не дублируется Content-Security-Policy)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Логи
    access_log /var/log/nginx/energoatlant_access.log;
    error_log  /var/log/nginx/energoatlant_error.log;
}
