<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">

<body>

<div class="top-bar"></div>

<header class="page-header">

        <path d="M13 2L4.5 13.5H12L11 22L19.5 10.5H12L13 2Z" fill="#f5c300"/>

  <div class="team-grid">

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <div class="team-card">
      <div class="tc-avatar">

      <a href="/cards/commercial.html" class="tc-btn">
        Визитка
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <div class="team-card">
      <div class="tc-avatar">

      </a>

    <div class="team-card">
      <div class="tc-avatar">
        Т

        Визитка
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

  <a href="https://energoatlant.ru" target="_blank" rel="noopener" class="site-link">
