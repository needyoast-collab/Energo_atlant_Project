<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Регистрация — ЭнергоАтлант</title>
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages/register.css">
</head>

<body class="grid-bg">
  <div id="preloader"><img src="/img/logo.png" alt="ЭнергоАтлант" class="preloader-logo"></div>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo"><img src="/img/logo.png" alt="ЭнергоАтлант"></div>
      <div class="auth-sub">Регистрация личного кабинета</div>
      <div class="auth-card">
        <h2 class="auth-title">Регистрация</h2>

        <div class="role-tabs">
          <div class="role-tab active" data-role="customer">Заказчик</div>
          <div class="role-tab" data-role="partner">Партнёр</div>
        </div>

        <form id="register-form">
          <input type="hidden" name="role" value="customer">
          <input type="hidden" name="name" id="full-name">
          <div class="form-group">
            <label class="form-label">Фамилия</label>
            <input type="text" class="form-control" name="last_name" placeholder="Иванов" required>
          </div>
          <div class="form-group">
            <label class="form-label">Имя</label>
            <input type="text" class="form-control" name="first_name" placeholder="Иван" required>
          </div>
          <div class="form-group">
            <label class="form-label">Отчество</label>
            <input type="text" class="form-control" name="patronymic" placeholder="Иванович" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" placeholder="your@email.ru">
          </div>
          <div class="form-group">
            <label class="form-label">Телефон</label>
            <input type="tel" class="form-control" name="phone" id="phone-mask" placeholder="+7 (9XX) XXX-XX-XX">
          </div>
          <div class="form-group">
            <label class="form-label">Логин</label>
            <input type="text" class="form-control" name="login" placeholder="Придумайте логин" required>
          </div>
          <div class="form-group">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" name="password" placeholder="Минимум 8 символов" minlength="8"
              required>
          </div>
          <p class="text-muted mt-2 auth-note">Если указан телефон, код подтверждения придёт по SMS. Если телефона нет, код придёт на email.</p>
          <button type="submit" class="btn btn-primary w-full mt-3">Зарегистрироваться</button>
        </form>
      </div>
      <div class="auth-footer">
        Уже есть аккаунт? <a href="/login.html">Войти</a><br>
        <a href="/" class="auth-footer-link-muted">← На главную</a>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="register-verify-modal">
    <div class="modal-card">
      <div class="modal-close" id="register-verify-close">×</div>
      <h3 class="modal-title-compact">Подтверждение регистрации</h3>
      <div class="verify-meta" id="register-verify-meta"></div>
      <div class="verify-status" id="register-verify-status"></div>
      <div class="form-group">
        <label class="form-label">6-значный код</label>
        <input type="text" class="form-control" id="register-verify-code" maxlength="6" placeholder="Введите код">
      </div>
      <div class="verify-resend">
        <button class="verify-link-btn" id="register-verify-resend" type="button" disabled>Отправить заново</button>
        <span class="verify-timer" id="register-verify-timer"></span>
      </div>
      <button type="button" class="btn btn-primary w-full" id="register-verify-submit">Подтвердить</button>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/js/preloader.js"></script>
  <script src="/vendor/imask.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/register_page.js"></script>
</body>
</html>
