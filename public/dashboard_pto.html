<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПТО — ЭнергоАтлант</title>
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages/dashboard-pto.css">
</head>
<body class="grid-bg">
<div id="preloader"><img src="/img/logo.png" alt="ЭнергоАтлант" class="preloader-logo"></div>
<div class="dash-layout">

  <!-- САЙДБАР -->
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="/img/logo.png" alt="ЭнергоАтлант" class="sidebar-logo-img"></div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-section="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Проекты
      </button>
      <button class="nav-item" data-section="documents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Документы
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-row">
          <a class="sidebar-avatar" id="sidebar-avatar" href="/profile.html" title="Профиль" aria-label="Открыть профиль">—</a>
          <div class="sidebar-user">
            <strong id="user-name">—</strong>
            <span>ПТО</span>
          </div>
        </div>
      <button class="btn btn-outline btn-sm w-full" id="logout-btn">Выйти</button>
    </div>
  </aside>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="dash-main">

    <!-- ПРОЕКТЫ -->
    <div class="dash-section active" id="section-projects">
      <div class="dash-header flex-between">
        <h1>Мои проекты</h1>
        <button class="btn btn-outline btn-sm" id="btn-join-project">+ Войти по коду</button>
      </div>
      <div id="projects-list" class="dashboard-card-grid"></div>
    </div>

    <!-- ДОКУМЕНТЫ -->
    <div class="dash-section" id="section-documents">
      <div class="dash-header flex-between">
        <h1>Исполнительная документация</h1>
        <select class="form-control form-control-sm max-w-260" id="docs-project-select">
          <option value="">— выберите проект —</option>
        </select>
      </div>

      <!-- Загрузка ИД -->
      <div class="card mb-3 is-hidden" id="upload-section">
        <div class="card-title">Загрузить документ</div>
        <form id="upload-doc-form">
          <div class="form-grid-2 form-group-tight">
            <div class="form-group form-group-compact">
              <label class="form-label">Тип документа</label>
              <select class="form-control" name="doc_type" id="doc-type-select" required>
                <option value="">— выберите —</option>
              </select>
            </div>
            <div class="form-group form-group-compact">
              <label class="form-label">Файл (PDF, Word, Excel, фото)</label>
              <input type="file" class="form-control form-control-sm" name="file" id="doc-file-input"
                accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp" required>
            </div>
          </div>
          <div class="form-group form-group-tight">
            <input type="text" class="form-control form-control-sm" name="description" placeholder="Описание (необязательно)">
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Загрузить</button>
        </form>
      </div>

      <!-- Список документов -->
      <div class="card" id="docs-list-card">
        <div id="docs-list" class="text-muted">Выберите проект</div>
      </div>
    </div>

  </main>
</div>

<!-- МОДАЛКА: войти по коду -->
<div class="modal-overlay" id="modal-join">
  <div class="modal modal-shell modal-shell-sm">
    <button class="modal-close" data-close="modal-join">×</button>
    <div class="modal-shell-header">
      <div class="modal-title">Войти в проект</div>
    </div>
    <form id="join-form" class="modal-shell-body autohide-scroll">
      <div class="form-group">
        <label class="form-label">Код проекта</label>
        <input type="text" class="form-control" name="code" data-mask="project-code" placeholder="PRJ-____-____" required>
      </div>
    </form>
    <div class="modal-shell-actions">
      <button type="button" class="btn btn-outline" data-close="modal-join">Отмена</button>
      <button type="submit" form="join-form" class="btn btn-primary">Присоединиться</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА: проект (этапы + документы) -->
<div class="modal-overlay" id="modal-project">
  <div class="modal modal-shell modal-shell-620">
    <button class="modal-close" data-close="modal-project">×</button>
    <div class="modal-shell-header">
    <div class="modal-title" id="modal-project-title">Проект</div>
    <div id="modal-project-meta" class="mb-3 text-muted"></div>

    <!-- Вкладки -->
    <div class="modal-tab-row">
      <button class="btn btn-sm btn-primary" id="pto-tab-btn-stages" data-ptotab="stages">Этапы</button>
      <button class="btn btn-sm btn-outline"  id="pto-tab-btn-docs"   data-ptotab="docs">Документы</button>
    </div>
    </div>
    <div class="modal-shell-body autohide-scroll">

    <!-- Этапы -->
    <div id="pto-tab-stages">
      <div class="section-mini-title">Этапы работ</div>
      <div id="modal-stages-list" class="stage-list"></div>
    </div>

    <!-- Документы -->
    <div id="pto-tab-docs" class="is-hidden">
      <div id="pto-modal-docs-list"><span class="text-muted">Загрузка...</span></div>
    </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/vendor/imask.min.js"></script>
<script src="/js/preloader.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/pto.js"></script>
</body>
</html>
